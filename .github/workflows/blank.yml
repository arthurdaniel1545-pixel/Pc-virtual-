name: RDP Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o secret RDP_PASSWORD no GitHub."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configurado. NLA permanece ativado."

      - name: Install applications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $apps = @(
            @{ Name = "7-Zip"; Id = "7zip.7zip" },
            @{ Name = "WinRAR"; Id = "RARLab.WinRAR" },
            @{ Name = "VirtualBox"; Id = "Oracle.VirtualBox" },
            @{ Name = "Steam"; Id = "Valve.Steam" }
          )

          foreach ($app in $apps) {
            Write-Host "Instalando $($app.Name)..."

            winget install `
              --id $app.Id `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            if ($LASTEXITCODE -eq 0) {
              Write-Host "$($app.Name): instalador concluído."
            } else {
              Write-Warning "$($app.Name): instalação falhou ou não foi confirmada."
            }
          }

      - name: Download Kali Linux ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory `
            -Path "$env:RUNNER_TEMP\Kali" -Force | Out-Null

          $url = "https://cdimage.kali.org/current/kali-linux-installer-amd64.iso"
          $file = "$env:RUNNER_TEMP\Kali\kali-linux-installer-amd64.iso"

          Invoke-WebRequest -Uri $url -OutFile $file

          if ((Get-Item $file).Length -lt 100MB) {
            throw "O download da ISO parece incompleto."
          }

          Write-Host "ISO baixada. Tamanho:"
          Get-Item $file | Select-Object Name, Length

      - name: Check Microsoft Store
        shell: pwsh
        run: |
          $store = Get-AppxPackage -AllUsers `
            -Name Microsoft.WindowsStore `
            -ErrorAction SilentlyContinue

          if ($store) {
            Write-Host "Microsoft Store encontrada."
            $store | Select-Object Name, Version
          } else {
            Write-Warning "Microsoft Store não está disponível nesta imagem Windows."
            Write-Warning "Não é possível garantir sua instalação nesta imagem do runner."
          }

      - name: Configure private Tailscale connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure o secret TAILSCALE_AUTH_KEY no GitHub."
          }

          $msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          $install = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" `
            -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            throw "Falha na instalação do Tailscale: $($install.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Executável do Tailscale não encontrado."
          }

          & $tailscale up "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=windows-rdp"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao conectar o Tailscale."
          }

          Write-Host "Tailscale conectado."

          & $tailscale ip -4

      - name: Verify RDP and installed applications
        shell: pwsh
        run: |
          Write-Host "=== Estado do RDP ==="

          Get-Service TermService |
            Select-Object Name, Status, StartType

          Write-Host "=== Porta local 3389 ==="

          Get-NetTCPConnection -LocalPort 3389 `
            -State Listen -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State

          Write-Host "=== Programas detectados ==="

          foreach ($name in @(
            "VirtualBox",
            "WinRAR",
            "Steam",
            "7-Zip"
          )) {
            $found = Get-ItemProperty `
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*$name*" }

            if ($found) {
              Write-Host "$name: encontrado."
            } else {
              Write-Warning "$name: não confirmado."
            }
          }

          Write-Host "Verificação concluída."
          
