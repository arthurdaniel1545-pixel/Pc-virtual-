name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
              Write-Error "Secret RDP_PASSWORD is empty or missing"
              exit 1
          }
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --hostname=pc-virtual
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install VirtualBox and WinRAR
        continue-on-error: true
        run: |
          choco install virtualbox winrar 7zip -y --no-progress
          Write-Host "Apps installed"

      - name: Download and prepare Kali Linux
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://cdimage.kali.org/current/"
          $page = Invoke-WebRequest -Uri $base -UseBasicParsing
          $file = $page.Links.href | Where-Object { $_ -match '^kali-linux-.*-virtualbox-amd64\.7z$' } | Select-Object -First 1
          if (-not $file) {
              Write-Error "Kali VirtualBox image not found"
              exit 1
          }
          Write-Host "Downloading $file"
          New-Item -ItemType Directory -Force -Path C:\VMs | Out-Null
          curl.exe -L -o "C:\VMs\kali.7z" "$base$file"
          & "C:\Program Files\7-Zip\7z.exe" x "C:\VMs\kali.7z" -o"C:\VMs\Kali" -y | Out-Null
          Remove-Item "C:\VMs\kali.7z" -Force
          $vbox = (Get-ChildItem -Path C:\VMs\Kali -Recurse -Filter *.vbox | Select-Object -First 1).FullName
          $name = ([xml](Get-Content $vbox)).VirtualBox.Machine.name
          $vbm = '"C:\Program Files\Oracle\VirtualBox\VBoxManage.exe"'
          $lines = @(
            '@echo off',
            ($vbm + ' registervm "' + $vbox + '"'),
            ($vbm + ' modifyvm "' + $name + '" --memory 4096 --cpus 2'),
            ($vbm + ' startvm "' + $name + '" --type gui'),
            'echo Usuario: kali  Senha: kali',
            'pause'
          )
          Set-Content -Path "C:\Users\Public\Desktop\Iniciar Kali.bat" -Value $lines -Encoding ASCII
          Write-Host "Kali ready: $name"

      - name: Maintain Connection
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "User: RDP"
          Write-Host "=================="
          while ($true) {
              Write-Host "RDP Active"
              Start-Sleep -Seconds 300
          }
