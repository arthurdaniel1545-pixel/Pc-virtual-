
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure RDP_PASSWORD in GitHub Secrets."
          }

          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name RDP -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name RDP -Password $secure -AccountNeverExpires
          } else {
            Set-LocalUser -Name RDP -Password $secure
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member RDP -ErrorAction SilentlyContinue

      - name: Check Microsoft Store
        shell: pwsh
        run: |
          Write-Host "Checking Microsoft Store..."

          $store = Get-AppxPackage -AllUsers `
            -Name Microsoft.WindowsStore `
            -ErrorAction SilentlyContinue

          if ($store) {
            Write-Host "Store package found: $($store.Version)"
          } else {
            Write-Warning "Microsoft Store package not found."

            $manifest = "$env:windir\WinStore\AppxManifest.xml"

            if (Test-Path $manifest) {
              Add-AppxPackage -Register $manifest `
                -DisableDevelopmentMode -ErrorAction Continue
            } else {
              Write-Warning "Store cannot be restored because its manifest is missing."
            }
          }

      - name: Install VirtualBox
        shell: pwsh
        run: |
          winget install --id Oracle.VirtualBox `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Install WinRAR
        shell: pwsh
        run: |
          winget install --id RARLab.WinRAR `
            --exact --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Install Steam
        shell: pwsh
        run: |
          $installer = "$env:TEMP\SteamSetup.exe"

          Invoke-WebRequest `
            -Uri "https://cdn.akamai.steamstatic.com/client/installer/SteamSetup.exe" `
            -OutFile $installer

          Start-Process $installer -ArgumentList "/S" -Wait

      - name: Download Kali Linux
        shell: pwsh
        run: |
          $dir = "C:\Kali"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          Write-Host "Download Kali Linux from the official source:"
          Write-Host "https://www.kali.org/get-kali/"

          $page = Invoke-WebRequest `
            -Uri "https://www.kali.org/get-kali/" `
            -UseBasicParsing

          $matches = [regex]::Matches(
            $page.Content,
            'https://[^" ]+\.7z'
          )

          if ($matches.Count -gt 0) {
            $link = $matches[0].Value
            Invoke-WebRequest -Uri $link -OutFile "$dir\kali.7z"
            Write-Host "Kali archive downloaded to $dir\kali.7z"
          } else {
            Write-Warning "Automatic archive discovery failed."
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Configure TAILSCALE_AUTH_KEY in GitHub Secrets."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up "--authkey=$env:TS_AUTHKEY" `
            --hostname=windows-rdp

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {
            $ip = (& $ts ip -4 | Select-Object -First 1)
            if ($ip) { break }
            Start-Sleep -Seconds 3
          }

          if (-not $ip) {
            throw "Tailscale IP unavailable."
          }

          "RDP_IP=$ip" >> $env:GITHUB_ENV

      - name: Display connection information
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:RDP_IP"
          Write-Host "Username: RDP"
          Write-Host "Port: 3389"

      - name: Keep session alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "RDP running: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
          
